<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Nicolás Zabala - Fullstack Developer Portfolio</title>
    <meta name="description" content="Fullstack Developer crafting exceptional digital experiences with modern technologies. Specializing in React, Node.js, and innovative web solutions." />
    <meta property="og:title" content="Nicolás Zabala - Fullstack Developer Portfolio" />
    <meta property="og:description" content="Fullstack Developer crafting exceptional digital experiences with modern technologies. View my latest projects and get in touch." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Libre+Franklin:wght@600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
    <script>
      /* Aplica el tema antes de que React monte para evitar el flash */
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          document.documentElement.classList.add(stored === "newspaper" ? "newspaper" : "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
